<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- meta:start (tools/build.mjs fills this in from content.js) -->
    <title>Portfolio</title>
    <meta name="robots" content="noindex" />
    <!-- meta:end -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link id="site-style" rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="page"></main>
    <script src="content.js"></script>
    <script>
      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      function items(section) {
        return (section && Array.isArray(section.items) ? section.items : []).filter(Boolean);
      }

      function youtubeId(url) {
        try {
          const parsed = new URL(url);
          const host = parsed.hostname.replace(/^(www|m)\./, "");
          if (host === "youtu.be") {
            return parsed.pathname.split("/").filter(Boolean)[0] || "";
          }
          if (host === "youtube.com" || host === "youtube-nocookie.com") {
            const watchId = parsed.searchParams.get("v");
            if (watchId) return watchId;
            const parts = parsed.pathname.split("/").filter(Boolean);
            const marker = parts.findIndex(function (part) {
              return part === "embed" || part === "shorts" || part === "live" || part === "v";
            });
            if (marker >= 0 && parts[marker + 1]) return parts[marker + 1];
          }
        } catch (error) {
          return "";
        }
        return "";
      }

      function nameHtml(name) {
        const parts = String(name || "").trim().split(/\s+/);
        if (parts.length < 2) return esc(name);
        const surname = parts.pop();
        return esc(parts.join(" ")) + ' <span class="surname">' + esc(surname) + "</span>";
      }

      function cacheBust(url, rev) {
        if (!url || !rev) return url;
        return url + (url.indexOf("?") === -1 ? "?" : "&") + "v=" + encodeURIComponent(rev);
      }

      function section(id, heading, body) {
        return (
          '<section aria-labelledby="' + id + '-heading">' +
          '<h2 id="' + id + '-heading">' + esc(heading) + "</h2>" +
          body +
          "</section>"
        );
      }

      function jobHtml(job) {
        if (job.brief) {
          const when = job.when ? ", " + esc(job.when) : "";
          return '<p class="brief">' + esc(job.role) + when + "</p>";
        }
        return (
          '<article class="job">' +
          "<h3>" + esc(job.role) + "</h3>" +
          '<p class="place">' + esc(job.place) + "</p>" +
          '<p class="when">' + esc(job.when) + "</p>" +
          "</article>"
        );
      }

      function slideHtml(item, rev) {
        const title = item.title || "Photo";
        const caption = item.caption ? "<span>" + esc(item.caption) + "</span>" : "";
        return (
          '<figure class="slide">' +
          '<img src="' + esc(cacheBust(item.image, rev)) + '" alt="' +
          esc(item.caption || title) + '" draggable="false">' +
          '<figcaption class="lower-third"><strong>' + esc(title) + "</strong>" +
          caption +
          "</figcaption>" +
          "</figure>"
        );
      }

      function videoHtml(video) {
        const title = esc(video.title || "Video");
        const id = youtubeId(video.url);
        if (!id) {
          return '<p class="video-link"><a href="' + esc(video.url) + '">' + title + "</a></p>";
        }
        return (
          '<figure class="video">' +
          '<div class="frame">' +
          '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(id) +
          '" title="' + title +
          '" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' +
          "</div>" +
          "<figcaption>" + title + "</figcaption>" +
          '<a class="print-url" href="' + esc(video.url) + '">' + esc(video.url) + "</a>" +
          "</figure>"
        );
      }

      function applyTheme(theme) {
        const root = document.documentElement.style;
        ["accent", "paper", "ink"].forEach(function (key) {
          if (theme && theme[key]) root.setProperty("--" + key, theme[key]);
          else root.removeProperty("--" + key);
        });
      }

      function render(data) {
        applyTheme(data.theme);
        if (data.name) {
          document.title = data.role ? data.name + " · " + data.role : data.name;
        }

        const photos = items(data.gallery).filter(function (item) {
          return item.image;
        });
        const videos = items(data.videos).filter(function (video) {
          return video.url;
        });
        const jobs = items(data.experience);
        const other = items(data.other);
        const lines = (data.lines || []).filter(Boolean);
        const contact = data.contact || {};
        const reference = data.reference || {};

        const gallerySection = photos.length
          ? section(
              "gallery",
              data.gallery.heading || "Gallery",
              '<div class="gallery" tabindex="0" aria-roledescription="carousel" aria-label="' +
                esc(data.gallery.heading || "Gallery") + '">' +
                '<div class="gallery-viewport"><div class="gallery-track">' +
                photos.map(function (item) {
                  return slideHtml(item, data.rev);
                }).join("") +
                "</div></div>" +
                '<div class="gallery-bar">' +
                '<button type="button" class="prev" aria-label="Previous photo">Previous</button>' +
                '<p class="gallery-count"></p>' +
                '<button type="button" class="next" aria-label="Next photo">Next</button>' +
                "</div></div>"
            )
          : "";

        const videosSection = videos.length
          ? section(
              "videos",
              data.videos.heading || "Videos",
              '<div class="videos">' + videos.map(videoHtml).join("") + "</div>"
            )
          : "";

        const experienceSection = jobs.length
          ? section("experience", data.experience.heading || "Experience", jobs.map(jobHtml).join(""))
          : "";

        const otherSection = other.length
          ? section(
              "other",
              data.other.heading || "Other",
              '<ul class="notes">' +
                other.map(function (item) {
                  return "<li>" + esc(item) + "</li>";
                }).join("") +
                "</ul>"
            )
          : "";

        const referenceSection = reference.text
          ? section("references", reference.heading || "References", "<p>" + esc(reference.text) + "</p>")
          : "";

        const contactItems = [];
        if (contact.email) {
          contactItems.push('<li><a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + "</a></li>");
        }
        if (contact.phone) {
          const tel = String(contact.phone).replace(/[^\d+]/g, "").replace(/^0/, "+44");
          contactItems.push('<li><a href="tel:' + esc(tel) + '">' + esc(contact.phone) + "</a></li>");
        }

        const roleLine = [data.role, data.location].filter(Boolean).map(esc).join(" · ");

        document.getElementById("page").innerHTML =
          "<header>" +
          '<hr class="mark">' +
          "<h1>" + nameHtml(data.name) + "</h1>" +
          (roleLine ? '<p class="role">' + roleLine + "</p>" : "") +
          (lines.length
            ? '<div class="lines">' +
              lines.map(function (line) {
                return '<p class="line">' + esc(line) + "</p>";
              }).join("") +
              "</div>"
            : "") +
          (data.summary ? '<p class="summary">' + esc(data.summary) + "</p>" : "") +
          (contactItems.length ? '<ul class="contact">' + contactItems.join("") + "</ul>" : "") +
          "</header>" +
          gallerySection +
          videosSection +
          experienceSection +
          otherSection +
          referenceSection;

        const gallery = document.querySelector(".gallery");
        if (gallery) mountGallery(gallery);
      }

      function mountGallery(root) {
        const track = root.querySelector(".gallery-track");
        const viewport = root.querySelector(".gallery-viewport");
        const slides = Array.prototype.slice.call(track.children);
        const count = root.querySelector(".gallery-count");
        const prev = root.querySelector(".prev");
        const next = root.querySelector(".next");
        let index = 0;
        let pointerId = null;
        let startX = 0;
        let startY = 0;
        let deltaX = 0;
        let axis = "";

        function go(nextIndex) {
          index = Math.max(0, Math.min(slides.length - 1, nextIndex));
          track.style.transition = "transform 0.35s ease";
          track.style.transform = "translateX(" + -index * 100 + "%)";
          count.textContent = index + 1 + " / " + slides.length;
          prev.disabled = index === 0;
          next.disabled = index === slides.length - 1;
          slides.forEach(function (slide, slideIndex) {
            slide.setAttribute("aria-hidden", slideIndex === index ? "false" : "true");
          });
        }

        function follow(pixelOffset) {
          track.style.transition = "none";
          track.style.transform = "translateX(calc(" + -index * 100 + "% + " + pixelOffset + "px))";
        }

        viewport.addEventListener("pointerdown", function (event) {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          pointerId = event.pointerId;
          startX = event.clientX;
          startY = event.clientY;
          deltaX = 0;
          axis = "";
        });

        viewport.addEventListener("pointermove", function (event) {
          if (pointerId !== event.pointerId) return;
          const moveX = event.clientX - startX;
          const moveY = event.clientY - startY;
          if (!axis) {
            if (Math.abs(moveX) < 8 && Math.abs(moveY) < 8) return;
            axis = Math.abs(moveX) > Math.abs(moveY) ? "x" : "y";
            if (axis === "x") {
              try {
                viewport.setPointerCapture(event.pointerId);
              } catch (error) {
                /* A mouse or trackpad drag still works if capture is unavailable. */
              }
            }
          }
          if (axis !== "x") return;
          deltaX = moveX;
          const atStart = index === 0 && deltaX > 0;
          const atEnd = index === slides.length - 1 && deltaX < 0;
          follow((atStart || atEnd ? 0.3 : 1) * deltaX);
        });

        function finish(event) {
          if (pointerId !== event.pointerId) return;
          pointerId = null;
          if (axis === "x") {
            if (deltaX <= -48) go(index + 1);
            else if (deltaX >= 48) go(index - 1);
            else go(index);
          }
          axis = "";
        }

        viewport.addEventListener("pointerup", finish);
        viewport.addEventListener("pointercancel", finish);

        prev.addEventListener("click", function () {
          go(index - 1);
        });
        next.addEventListener("click", function () {
          go(index + 1);
        });
        root.addEventListener("keydown", function (event) {
          if (event.key === "ArrowRight") {
            go(index + 1);
            event.preventDefault();
          }
          if (event.key === "ArrowLeft") {
            go(index - 1);
            event.preventDefault();
          }
        });

        go(0);
      }

      render(site);

      // Bumped when this file changes. content.js and styles.css are checked on each visit.
      var PAGE = "1";

      function freshUrl(path) {
        return path + "?ts=" + Date.now();
      }

      function hashText(text) {
        var total = 0;
        for (var i = 0; i < text.length; i++) total = (total * 31 + text.charCodeAt(i)) >>> 0;
        return total.toString(36);
      }

      function readSite(text) {
        return new Function(text + "\nreturn site;")();
      }

      function lookForUpdates() {
        if (location.protocol === "file:") return;
        var styleLink = document.getElementById("site-style");
        Promise.all([
          fetch(freshUrl("index.html"), { cache: "no-store" }).then(function (response) {
            return response.text();
          }),
          fetch(freshUrl("content.js"), { cache: "no-store" }).then(function (response) {
            return response.text();
          }),
          fetch(freshUrl("styles.css"), { cache: "no-store" }).then(function (response) {
            return response.text();
          }),
          styleLink
            ? fetch(styleLink.href, { cache: "force-cache" }).then(function (response) {
                return response.text();
              })
            : Promise.resolve(""),
        ])
          .then(function (files) {
            var html = files[0];
            var contentText = files[1];
            var freshStyle = files[2];
            var currentStyle = files[3];
            var marker = html.match(/var PAGE = "([^"]*)"/);
            if (marker && marker[1] !== PAGE) {
              var next = new URL(location.href);
              next.searchParams.set("v", marker[1]);
              location.replace(next.href);
              return;
            }
            if (styleLink && freshStyle && freshStyle !== currentStyle) {
              styleLink.href = "styles.css?v=" + hashText(freshStyle);
            }
            var freshSite = readSite(contentText);
            if (JSON.stringify(freshSite) !== JSON.stringify(site)) render(freshSite);
          })
          .catch(function () {});
      }

      lookForUpdates();
    </script>
  </body>
</html>
